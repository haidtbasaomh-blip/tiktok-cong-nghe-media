name: Capture Windows clipboard review frames
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-windows-clipboard-review.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-11-arm
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Install screen capture tools
        run: python -m pip install pillow pyautogui
      - name: Capture clipboard operation on the Windows desktop
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Get-Process explorer -ErrorAction Stop | Select-Object ProcessName, SessionId
          $env:CLIPBOARD_REVIEW_OUTPUT = Join-Path $PWD 'clipboard-review'
          @'
          import os
          import subprocess
          import time
          from pathlib import Path
          import pyautogui as ui
          from PIL import ImageGrab, ImageChops

          output = Path(os.environ["CLIPBOARD_REVIEW_OUTPUT"])
          output.mkdir(exist_ok=True)
          if ui.size().width < 800:
              raise RuntimeError("Windows desktop is unavailable or too small")

          def snap(name):
              time.sleep(0.65)
              image = ImageGrab.grab().convert("RGB")
              image.save(output / (name + ".png"))
              return image

          setup = snap("00-runner-desktop")
          if setup.size == (1024, 768) and all(
              setup.getpixel((x, y))[2] > 120 and setup.getpixel((x, y))[0] < 40
              for x, y in ((560, 375), (560, 598), (829, 657))
          ):
              # On this disposable runner, opt out of optional location and typing telemetry.
              ui.click(570, 375)
              ui.click(570, 598)
              ui.click(865, 653)
              time.sleep(2)
              privacy_more = snap("00-privacy-next")
              if all(privacy_more.getpixel((x, y))[2] > 110 for x, y in ((560, 326), (560, 499), (829, 657))):
                  for x, y in ((560, 326), (560, 499)):
                      if privacy_more.getpixel((x, y))[0] < 40:
                          ui.click(x, y)
                  ui.click(867, 657)
                  time.sleep(15)
                  snap("00-after-saving-privacy")
          subprocess.Popen(["notepad.exe"])
          time.sleep(7)
          ui.hotkey("alt", "space")
          ui.press("x")
          ui.press("escape")
          ui.write("Bao cao hom nay\nKiem tra thiet bi", interval=0.045)
          ui.press("enter")
          before = snap("01-notepad-demo")
          ui.hotkey("win", "v")
          after = snap("02-clipboard-first-open")
          ui.press("tab")
          ui.press("enter")
          time.sleep(2)
          snap("03-after-activate")
          ui.press("escape")
          ui.hotkey("ctrl", "home")
          ui.keyDown("shift")
          ui.press("end")
          ui.keyUp("shift")
          snap("04-select-first")
          ui.hotkey("ctrl", "c")
          ui.press("down")
          ui.press("home")
          ui.keyDown("shift")
          ui.press("end")
          ui.keyUp("shift")
          ui.hotkey("ctrl", "c")
          snap("05-copy-second")
          ui.hotkey("ctrl", "end")
          ui.press("enter")
          ui.hotkey("win", "v")
          snap("06-history")
          ui.press("down")
          ui.press("enter")
          snap("07-paste-result")
          change = ImageChops.difference(before, after).getbbox()
          if not change or (change[2] - change[0]) < 100 or (change[3] - change[1]) < 100:
              raise RuntimeError("Win+V did not visibly open the native clipboard panel")
          '@ | Set-Content -Path capture_clipboard.py -Encoding utf8
          python capture_clipboard.py
      - name: Retain frames for human verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clipboard-review-frames
          path: clipboard-review/*.png
          if-no-files-found: warn
          retention-days: 7
