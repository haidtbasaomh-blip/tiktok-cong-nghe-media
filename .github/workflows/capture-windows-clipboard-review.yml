name: Capture Windows clipboard review frames
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-windows-clipboard-review.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Install screen capture tools
        run: python -m pip install pillow pyautogui
      - name: Capture clipboard operation on the Windows desktop
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Get-Process explorer -ErrorAction Stop | Select-Object ProcessName, SessionId
          $env:CLIPBOARD_REVIEW_OUTPUT = Join-Path $PWD 'clipboard-review'
          @'
          import os
          import ctypes
          from ctypes import wintypes
          import subprocess
          import time
          from pathlib import Path
          import pyautogui as ui
          from PIL import ImageGrab, ImageChops

          output = Path(os.environ["CLIPBOARD_REVIEW_OUTPUT"])
          output.mkdir(exist_ok=True)
          if ui.size().width < 800:
              raise RuntimeError("Windows desktop is unavailable or too small")

          def snap(name):
              time.sleep(0.65)
              image = ImageGrab.grab().convert("RGB")
              if name.startswith("demo-") and find_window("Demo"):
                  image.crop((0, 0, 1024, 690)).save(output / (name + ".png"))
              return image

          setup = snap("00-runner-desktop")
          if setup.size == (1024, 768) and all(
              setup.getpixel((x, y))[2] > 120 and setup.getpixel((x, y))[0] < 40
              for x, y in ((560, 375), (560, 598), (829, 657))
          ):
              # On this disposable runner, opt out of optional location and typing telemetry.
              ui.click(570, 375)
              ui.click(570, 598)
              ui.click(865, 653)
              time.sleep(2)
              privacy_more = snap("00-privacy-next")
              if all(privacy_more.getpixel((x, y))[2] > 110 for x, y in ((560, 326), (560, 499), (829, 657))):
                  for x, y in ((560, 326), (560, 499)):
                      if privacy_more.getpixel((x, y))[0] < 40:
                          ui.click(x, y)
                  ui.click(867, 657)
                  time.sleep(15)
                  snap("00-after-saving-privacy")
          def find_window(fragment):
              matches = []
              user32 = ctypes.windll.user32
              callback_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
              @callback_type
              def collect(hwnd, _):
                  title = ctypes.create_unicode_buffer(200)
                  user32.GetWindowTextW(hwnd, title, 200)
                  if user32.IsWindowVisible(hwnd) and fragment.casefold() in title.value.casefold():
                      matches.append(hwnd)
                  return True
              user32.EnumWindows(collect, 0)
              return matches[0] if matches else 0

          ui.press("escape")
          demo = output.parent / "Demo.txt"
          demo.write_text("Bao cao hom nay\nKiem tra thiet bi\n", encoding="utf-8")
          subprocess.Popen(["notepad.exe", str(demo)])
          time.sleep(10)
          hwnd = find_window("Demo")
          if not hwnd:
              raise RuntimeError("Notepad test document window not found")
          user32 = ctypes.windll.user32
          user32.ShowWindow(wintypes.HWND(hwnd), 3)
          user32.SetWindowPos(wintypes.HWND(hwnd), wintypes.HWND(-1), 0, 0, 0, 0, 0x43)
          time.sleep(1)
          ui.click(110, 130)
          user32.SetWindowPos(wintypes.HWND(hwnd), wintypes.HWND(-2), 0, 0, 0, 0, 0x43)
          if user32.GetForegroundWindow() != hwnd:
              raise RuntimeError("Notepad could not be brought to the foreground")
          ui.hotkey("ctrl", "home")
          for _ in range(5):
              ui.hotkey("ctrl", "=")
          before = snap("demo-01-notepad")
          ui.hotkey("win", "v")
          time.sleep(10)
          after = snap("demo-02-turn-on")

          def panel_origin(base, visible):
              delta = ImageChops.difference(base, visible).convert("L").crop((0, 55, 1024, 690))
              delta = delta.point(lambda v: 255 if v > 9 else 0)
              counts = [delta.crop((0, y, 1024, y+1)).histogram()[255] for y in range(delta.height)]
              candidate = next((y for y, n in enumerate(counts) if n > 260), None)
              if candidate is None:
                  raise RuntimeError("Clipboard panel is not visible on the Windows desktop")
              line = delta.crop((0, candidate+18, 1024, candidate+19)).getbbox()
              return line[0], candidate + 55

          try:
              x, y = panel_origin(before, after)
          except RuntimeError:
              ui.hotkey("win", "v")
              time.sleep(8)
              after = snap("demo-02-turn-on")
              x, y = panel_origin(before, after)
          ui.click(x + 180, y + 319)
          time.sleep(3)
          snap("demo-02-after-enable")
          ui.press("escape")

          def clipboard_text():
              return subprocess.check_output(
                  ["powershell", "-NoProfile", "-Command", "Get-Clipboard -Raw"],
                  text=True,
              ).strip()

          def restore_notepad():
              # A runner startup prompt can appear in Windows Terminal after the copy steps.
              subprocess.run(["taskkill", "/F", "/IM", "wsl.exe"], capture_output=True)
              popup = find_window("wsl.exe")
              if popup:
                  user32.PostMessageW(wintypes.HWND(popup), 0x10, 0, 0)
                  time.sleep(.6)
              user32.SetWindowPos(wintypes.HWND(hwnd), wintypes.HWND(-1), 0, 0, 0, 0x43)
              user32.SetWindowPos(wintypes.HWND(hwnd), wintypes.HWND(-2), 0, 0, 0, 0x43)
              if user32.GetForegroundWindow() != hwnd:
                  raise RuntimeError("Notepad lost focus")

          restore_notepad()
          ui.click(105, 120)
          ui.hotkey("ctrl", "home")
          ui.keyDown("shift")
          ui.press("end")
          ui.keyUp("shift")
          snap("demo-03-select-first")
          ui.hotkey("ctrl", "c")
          if clipboard_text() != "Bao cao hom nay":
              raise RuntimeError("The first Notepad selection did not reach the clipboard")
          restore_notepad()
          ui.hotkey("ctrl", "home")
          ui.press("down")
          ui.press("home")
          ui.keyDown("shift")
          ui.press("end")
          ui.keyUp("shift")
          snap("demo-04-select-second")
          restore_notepad()
          ui.hotkey("ctrl", "c")
          if clipboard_text() != "Kiem tra thiet bi":
              raise RuntimeError("The second Notepad selection did not reach the clipboard")
          ui.hotkey("ctrl", "end")

          def record(seconds, frames):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  next_frame = time.monotonic() + .125
                  frames.append(ImageGrab.grab().convert("RGB").crop((0, 0, 1024, 690)))
                  time.sleep(max(0, next_frame - time.monotonic()))

          original = ["Bao cao hom nay", "Kiem tra thiet bi"]
          for offset in (205, 165, 235, 265, 185, 145, 295):
              restore_notepad()
              ui.press("escape")
              ui.hotkey("ctrl", "end")
              blank = snap("demo-05-before-paste")
              frames = []
              record(.5, frames)
              ui.hotkey("win", "v")
              record(1.4, frames)
              history = ImageGrab.grab().convert("RGB")
              history.crop((0, 0, 1024, 690)).save(output / f"demo-diagnostics-history-{offset}.png")
              try:
                  px, py = panel_origin(blank, history)
              except (RuntimeError, TypeError):
                  continue
              # A real flyout is anchored by the left-aligned caret and spans 360 px.
              if not (0 <= px < 40 and 65 <= py < 210):
                  continue
              click_x, click_y = px + 115, py + offset
              ui.moveTo(click_x, click_y, .2)
              record(.65, frames)
              ui.click()
              record(1.15, frames)
              result = ImageGrab.grab().convert("RGB")
              result.crop((0, 0, 1024, 690)).save(output / f"demo-diagnostics-result-{offset}.png")
              ui.press("escape")
              if user32.GetForegroundWindow() != hwnd:
                  continue
              ui.hotkey("ctrl", "s")
              time.sleep(.35)
              actual = demo.read_text(encoding="utf-8-sig").splitlines()
              if actual == [*original, original[0]]:
                  history.crop((0, 0, 1024, 690)).save(output / "demo-06-history.png")
                  result.crop((0, 0, 1024, 690)).save(output / "demo-07-result.png")
                  for i, frame in enumerate(frames):
                      frame.save(output / f"native-{i:03d}.png")
                  (output / "coordinates.txt").write_text(f"{x},{y}\n{px},{py}\n{click_x},{click_y}\n")
                  print("Verified in the saved Notepad document: clipboard history pasted the older snippet.")
                  break
              if actual != original:
                  ui.hotkey("ctrl", "z")
                  ui.hotkey("ctrl", "s")
                  time.sleep(.35)
                  if demo.read_text(encoding="utf-8-sig").splitlines() != original:
                      raise RuntimeError("Unable to restore the original Notepad document")
              print(f"Clipboard option at offset {offset}: {actual!r}")
          else:
              raise RuntimeError("Unable to verify the older clipboard item was pasted into Notepad")
          '@ | Set-Content -Path capture_clipboard.py -Encoding utf8
          python capture_clipboard.py
      - name: Retain frames for human verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clipboard-review-frames
          path: |
            clipboard-review/demo-*
            clipboard-review/native-*
            clipboard-review/coordinates.txt
          if-no-files-found: warn
          retention-days: 7
