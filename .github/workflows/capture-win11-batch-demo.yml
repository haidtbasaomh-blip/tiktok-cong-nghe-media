name: Capture three Windows 11 demo clips
on:
  workflow_dispatch:
  push:
    branches: [win11-batch-5-review-20261122]
    paths:
      - .github/workflows/capture-win11-batch-demo.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Install the screen-capture dependencies
        run: python -m pip install pillow pyautogui
      - name: Record the demo desktop
        shell: pwsh
        run: |
          @'
          import ctypes
          import json
          import os
          from pathlib import Path
          import subprocess
          import threading
          import time
          
          import pyautogui as ui
          from PIL import Image, ImageDraw, ImageGrab
          
          OUTPUT = Path("win11-capture").resolve()
          OUTPUT.mkdir(exist_ok=True)
          USER32 = ctypes.windll.user32
          HIDDEN = subprocess.CREATE_NO_WINDOW
          ui.PAUSE = .15
          
          UI_AUTOMATION = r"""
          param([string]$Label)
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class ActiveWindow { [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow(); }'
          $root = [Windows.Automation.AutomationElement]::FromHandle([ActiveWindow]::GetForegroundWindow())
          $elements = $root.FindAll([Windows.Automation.TreeScope]::Descendants,
              [Windows.Automation.Condition]::TrueCondition)
          $best = $null
          $score = 1000
          foreach ($e in $elements) {
              $info = $e.Current
              if ($info.IsOffscreen -or -not $info.IsEnabled -or -not $info.Name) { continue }
              $name = $info.Name.Trim()
              if ($name -ieq $Label) { $rank = 0 }
              elseif ($name.StartsWith($Label + ' ', [StringComparison]::OrdinalIgnoreCase)) { $rank = 10 }
              else { continue }
              $type = $info.ControlType.ProgrammaticName
              if ($type -match '(Button|ListItem|TabItem|DataItem|Hyperlink|TreeItem)$') { $rank -= 2 }
              $rect = $info.BoundingRectangle
              if ($rank -lt $score -and $rect.Width -gt 2 -and $rect.Height -gt 2) {
                  $best = @{ x = [int]($rect.X + $rect.Width / 2); y = [int]($rect.Y + $rect.Height / 2); name = $name }
                  $score = $rank
              }
          }
          if ($best) { $best | ConvertTo-Json -Compress }
          """
          uia_script = OUTPUT.parent / "find-visible-control.ps1"
          uia_script.write_text(UI_AUTOMATION, encoding="utf-8")
          
          
          def ps(script):
              return subprocess.run(
                  ["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", script],
                  check=True, capture_output=True, text=True, creationflags=HIDDEN
              ).stdout
          
          
          def locate(label):
              response = subprocess.run(
                  ["powershell.exe", "-NoProfile", "-NonInteractive", "-File", str(uia_script), label],
                  capture_output=True, text=True, creationflags=HIDDEN, timeout=15,
              )
              if response.returncode == 0 and response.stdout.strip():
                  return json.loads(response.stdout)
              return None
          
          
          def click_control(label, timeout=16):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  match = locate(label)
                  if match and 0 < match["x"] < ui.size().width and 0 < match["y"] < ui.size().height:
                      ui.moveTo(match["x"], match["y"], .25)
                      time.sleep(.4)
                      ui.click()
                      print("Clicked", label, match, flush=True)
                      return
                  time.sleep(.5)
              raise RuntimeError(f"Control is unavailable: {label}")
          
          
          def foreground_title():
              title = ctypes.create_unicode_buffer(512)
              USER32.GetWindowTextW(USER32.GetForegroundWindow(), title, len(title))
              return title.value
          
          
          def wait_title(expected, timeout=18):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  if expected.casefold() in foreground_title().casefold():
                      return
                  time.sleep(.5)
              raise RuntimeError(f"Expected {expected!r}; foreground is {foreground_title()!r}")
          
          
          def maximize():
              USER32.ShowWindow(USER32.GetForegroundWindow(), 3)
              time.sleep(.6)
          
          
          def save_proof(folder, name):
              ImageGrab.grab().convert("RGB").save(folder / f"proof-{name}.jpg", quality=90)
          
          
          class Recording:
              def __init__(self, folder):
                  self.folder = folder
                  self.stop = threading.Event()
                  self.frames = 0
                  self.worker = threading.Thread(target=self.capture)
          
              def capture(self):
                  while not self.stop.is_set():
                      baseline = time.monotonic()
                      image = ImageGrab.grab().convert("RGB")
                      image.save(self.folder / f"frame-{self.frames:05d}.jpg", quality=83)
                      self.frames += 1
                      self.stop.wait(max(0, .1 - (time.monotonic() - baseline)))
          
              def __enter__(self):
                  self.started = time.monotonic()
                  self.worker.start()
                  return self
          
              def __exit__(self, *exc):
                  elapsed = time.monotonic() - self.started
                  self.stop.set()
                  self.worker.join()
                  if not exc[0] and self.frames >= 20:
                      (self.folder / "capture.json").write_text(
                          json.dumps({"frames": self.frames, "seconds": elapsed}), encoding="utf-8"
                      )
          
          
          def startup(folder):
              ps(
                  "$folder = [Environment]::GetFolderPath('Startup'); "
                  "$shell = New-Object -ComObject WScript.Shell; "
                  "$link = $shell.CreateShortcut((Join-Path $folder 'Demo Startup App.lnk')); "
                  "$link.TargetPath = Join-Path $env:WINDIR 'System32\\notepad.exe'; $link.Save()"
              )
              with Recording(folder):
                  time.sleep(.7)
                  ui.hotkey("ctrl", "shift", "esc")
                  wait_title("Task Manager")
                  maximize()
                  click_control("Startup apps")
                  time.sleep(1.5)
                  save_proof(folder, "startup-list")
                  candidate = locate("Demo Startup App") or locate("notepad")
                  if candidate:
                      click_control(candidate["name"])
                      click_control("Disable", timeout=7)
                      time.sleep(1)
                      save_proof(folder, "disabled")
                  else:
                      print("Startup apps shown; demo shortcut was not listed", flush=True)
                  time.sleep(1)
          
          
          def snip(folder):
              source = OUTPUT.parent / "SnipDemo.txt"
              source.write_text("WINDOWS 11 DEMO\n--------------------------\nExample only, no personal data.\nCapture this part of the window.\n", encoding="utf-8")
              subprocess.Popen(["notepad.exe", str(source)])
              wait_title("SnipDemo")
              maximize()
              ui.click(80, 110)
              for _ in range(5):
                  ui.hotkey("ctrl", "=")
              ui.moveTo(650, 350)
              time.sleep(1)
              with Recording(folder):
                  time.sleep(.7)
                  save_proof(folder, "demo")
                  ui.hotkey("win", "shift", "s")
                  time.sleep(1.7)
                  save_proof(folder, "toolbar")
                  ui.moveTo(10, 70, .35)
                  ui.dragTo(580, 201, 1.3)
                  time.sleep(1.6)
                  bitmap = ImageGrab.grabclipboard()
                  if not isinstance(bitmap, Image.Image) or abs(bitmap.width - 570) > 12 or abs(bitmap.height - 131) > 12:
                      raise RuntimeError("Clipboard does not contain the expected rectangular screenshot")
                  actual = bitmap.convert("RGB")
                  actual.save(folder / "proof-clipboard.jpg", quality=95)
                  # Open the exact pixels read from the Windows clipboard in the native viewer.
                  clipboard_file = OUTPUT.parent / "SnipResult.png"
                  actual.save(clipboard_file)
                  os.startfile(clipboard_file)
                  wait_title("SnipResult")
                  maximize()
                  ui.moveTo(614, 325)
                  time.sleep(1.5)
                  save_proof(folder, "result")
                  time.sleep(1)
          
          
          def storage(folder):
              with Recording(folder):
                  time.sleep(.7)
                  ui.hotkey("win", "r")
                  time.sleep(.45)
                  ui.write("ms-settings:storagesense", .045)
                  ui.press("enter")
                  wait_title("Settings")
                  maximize()
                  click_control("Show more categories", timeout=30)
                  time.sleep(1.5)
                  save_proof(folder, "storage")
                  for _ in range(5):
                      if locate("Temporary files"):
                          break
                      ui.moveTo(826, 490)
                      ui.scroll(-2)
                      time.sleep(.5)
                  click_control("Temporary files", timeout=15)
                  time.sleep(5)
                  save_proof(folder, "temporary-files")
                  time.sleep(1)
          
          
          def prepare():
              if ui.size().width < 800:
                  raise RuntimeError("Windows desktop is unavailable or too small")
              overview = ImageGrab.grab().convert("RGB")
              if overview.size == (1024, 768) and all(
                  overview.getpixel(point)[2] > 120 and overview.getpixel(point)[0] < 40
                  for point in ((560, 375), (560, 598), (829, 657))
              ):
                  ui.click(570, 375)
                  ui.click(570, 598)
                  ui.click(865, 653)
                  time.sleep(2)
                  page = ImageGrab.grab().convert("RGB")
                  if all(page.getpixel(point)[2] > 110 for point in ((560, 326), (560, 499), (829, 657))):
                      for point in ((560, 326), (560, 499)):
                          if page.getpixel(point)[0] < 40:
                              ui.click(*point)
                      ui.click(867, 657)
                      time.sleep(15)
              ui.press("escape")
          
          
          prepare()
          summary = {}
          for name, capture in [("03-startup-apps", startup), ("04-snipping-tool", snip), ("05-storage", storage)]:
              folder = OUTPUT / name
              folder.mkdir(exist_ok=True)
              try:
                  subprocess.run(["taskkill", "/F", "/IM", "wsl.exe"], capture_output=True, creationflags=HIDDEN)
                  ui.hotkey("win", "d")
                  time.sleep(.7)
                  capture(folder)
                  summary[name] = "captured" if (folder / "capture.json").exists() else "no frames"
              except Exception as error:
                  summary[name] = str(error)
                  print(name, error, flush=True)
                  save_proof(folder, "error")
              ui.press("escape")
          (OUTPUT / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary), flush=True)
          '@ | Set-Content -Path capture-demo.py -Encoding utf8
          python capture-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: win11-raw-frames
          path: win11-capture/
          retention-days: 7
  encode:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win11-raw-frames
          path: frames
      - name: Install FFmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Encode and verify the original captures
        run: |
          set -euo pipefail
          mkdir -p raw
          cp frames/summary.json raw/
          for directory in frames/*/; do
            clip="$(basename "$directory")"
            mkdir -p "raw/$clip"
            cp "$directory"proof-*.jpg "raw/$clip/" || true
            if [[ ! -f "$directory/capture.json" ]]; then continue; fi
            rate="$(jq -r '.frames / .seconds' "$directory/capture.json")"
            ffmpeg -hide_banner -loglevel error -framerate "$rate" -i "$directory/frame-%05d.jpg" \
              -vf 'fps=24,format=yuv420p' -c:v libx264 -preset fast -crf 18 -movflags +faststart "raw/$clip.mp4"
            ffmpeg -v error -xerror -i "raw/$clip.mp4" -f null -
            ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact "raw/$clip.mp4"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: win11-three-raw-demo-clips
          path: raw/
          retention-days: 30
