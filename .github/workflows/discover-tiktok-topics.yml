name: TikTok mixed-topic research feeds (read-only, never publish)
on:
  schedule:
    - cron: '45 23 * * *' # 06:45 Asia/Bangkok daily
  workflow_dispatch:
  push:
    paths:
      - tools/discover_topics.py
      - series/research_feeds.json
      - .github/workflows/discover-tiktok-topics.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Collect RSS headlines, timestamps and source links only
        run: python3 tools/discover_topics.py
      - name: Save research candidates as an internal QA artifact, NOT a post
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-topics-research
          path: series/research_candidates.json
          retention-days: 7
          if-no-files-found: warn
