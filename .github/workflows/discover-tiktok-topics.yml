name: TikTok mixed-topic research feeds (read-only, never publish)
on:
  schedule:
    - cron: '45 23 * * *' # 06:45 Asia/Bangkok daily
  workflow_dispatch:
  push:
    paths:
      - tools/discover_topics.py
      - tools/daily_idea_lab.py
      - tests/test_daily_idea_lab.py
      - tests/test_trend_research.py
      - series/global_tiktok_youtube_creator_inspiration.json
      - series/research_feeds.json
      - .github/workflows/discover-tiktok-topics.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Collect RSS headlines, timestamps and source links only
        run: python3 tools/discover_topics.py
      - name: Check that the creator-inspired lab does not publish or fabricate view counts
        run: python3 -m unittest discover -s tests -p test_daily_idea_lab.py -v
      - name: Check trends, news categories and non-robotic audio direction offline
        run: python3 -m unittest discover -s tests -p test_trend_research.py -v
      - name: Propose up to 25 different video ideas, each needing fact and rights verification
        run: python3 tools/daily_idea_lab.py
      - name: Save research candidates as an internal QA artifact, NOT a post
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-topics-research
          path: |
            series/research_candidates.json
            series/daily_ideas_latest.json
            series/daily_ideas_latest.md
          retention-days: 21
          if-no-files-found: warn
