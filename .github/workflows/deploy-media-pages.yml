name: Deploy 100 TikTok MP4 to public GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'TikTok_100_Video_Thu_Thuat_Cong_Nghe.zip'
      - 'media-parts/**'
      - 'media-voice-preview/**'
      - '.github/workflows/deploy-media-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack exactly 100 original MP4s
        run: |
          python3 - <<'PY'
          import json
          import os
          import base64
          import zipfile
          from pathlib import Path
          source = Path('TikTok_100_Video_Thu_Thuat_Cong_Nghe.zip')
          if not source.is_file():
              pieces = sorted(Path('media-parts').glob('part*.b64'))
              if not pieces:
                  raise SystemExit('MEDIA_PARTS_MISSING')
              # Parts are ASCII slices of one complete base64 ZIP; never log content.
              encoded = ''.join(piece.read_text(encoding='ascii') for piece in pieces)
              source.write_bytes(base64.b64decode(encoded, validate=True))
              print('ZIP_RECONSTRUCTED_FROM_GITHUB_BLOBS', len(pieces))
          public = Path('_site')
          public.mkdir(exist_ok=True)
          with zipfile.ZipFile(source) as z:
              names = z.namelist()
              required = [f'videos/CN{i:03d}.mp4' for i in range(1,101)]
              if any(n not in names for n in required):
                  raise SystemExit('ZIP_MISSING_ONE_OR_MORE_OF_100_MP4')
              manifest = json.loads(z.read('100_video_scripts.json').decode('utf-8'))
              if not isinstance(manifest, list) or len(manifest) != 100:
                  raise SystemExit('INVALID_100_VIDEO_MANIFEST')
              if [m.get('id') for m in manifest] != [f'CN{i:03d}' for i in range(1,101)]:
                  raise SystemExit('MANIFEST_ID_ORDER_MISMATCH')
              (public / '100_video_scripts.json').write_text(json.dumps(manifest,ensure_ascii=False),encoding='utf-8')
              for index, name in enumerate(required, 1):
                  payload = z.read(name)
                  if len(payload) < 40000 or b'ftyp' not in payload[:128]:
                      raise SystemExit(f'INVALID_MP4_AT_CN{index:03d}')
                  (public / f'CN{index:03d}.mp4').write_bytes(payload)
          (public / '.nojekyll').write_text('')
          (public / 'index.html').write_text('<!doctype html><meta charset="utf-8"><title>TikTok tech video media</title><p>100 public MP4 videos for Buffer</p>',encoding='utf-8')
          print('VERIFIED_AND_EXTRACTED_100_PUBLIC_MP4')
          PY
      - name: Include one voice-audition playback page (original 100 public MP4 files unchanged)
        run: |
          mkdir -p _site/previews
          test -s media-voice-preview/WINDOWS_V_GIONG_BAC_KHANG_NGHE_TRUC_TIEP.mp4
          cp media-voice-preview/WINDOWS_V_GIONG_BAC_KHANG_NGHE_TRUC_TIEP.mp4 _site/previews/windows-v-giong-bac.mp4
          cat > _site/previews/windows-v.html <<'HTML'
          <!doctype html>
          <html lang="vi"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Video thử giọng Bắc • Góc Công Nghệ Tiện Ích</title>
          <style>
            body{margin:0;background:linear-gradient(135deg,#071334,#282069);font:16px system-ui,sans-serif;color:#f5f9ff;text-align:center}
            main{max-width:470px;margin:0 auto;padding:24px 16px 48px}
            h1{font-size:23px;line-height:1.25;margin:8px 0 18px}
            video{background:#071533;width:min(100%,340px);aspect-ratio:9/16;border-radius:17px;border:2px solid #42d7f0;box-shadow:0 16px 44px #0008}
            p{font-size:14px;line-height:1.5;color:#deecff}
            a{color:#ffe16a}
          </style></head>
          <body><main>
            <h1>GÓC CÔNG NGHỆ TIỆN ÍCH</h1>
            <video controls playsinline preload="auto" aria-label="Video có giọng Bắc nghe thử">
              <source src="./windows-v-giong-bac.mp4" type="video/mp4">
              Trình duyệt không hỗ trợ video MP4.
            </video>
            <p>Nhấn nút phát và bật âm lượng để nghe giọng nam miền Bắc.<br>
               Bản thử âm thanh 11,5 giây • Giao diện Windows mô phỏng • Chưa đăng TikTok.</p>
            <a href="./windows-v-giong-bac.mp4">Mở hoặc tải MP4</a>
          </main></body></html>
          HTML
      - name: Configure GitHub Pages automatically where allowed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish 100 MP4 with stable URLs
        id: deployment
        uses: actions/deploy-pages@v4
