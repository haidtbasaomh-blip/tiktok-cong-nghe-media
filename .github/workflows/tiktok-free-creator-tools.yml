name: TikTok free video studio tools - QA only (never publish)
on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Optional approved local file inside licensed-inputs/; leave blank for QA only"
        required: false
        type: string
  push:
    paths:
      - "tools/creator_toolchain_audit.py"
      - "tools/trim_owned_video.py"
      - "tools/requirements-free-toolchain.txt"
      - "tests/test_free_toolchain.py"
      - "series/approved_raw_footage.json"
      - ".github/workflows/tiktok-free-creator-tools.yml"
  schedule:
    - cron: '5 15 * * 1' # Monday 22:05 VN; read-only archive audit
permissions:
  contents: read
concurrency:
  group: tiktok-free-studio-qa
  cancel-in-progress: false
jobs:
  qa_free_creator_tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-free-toolchain.txt
      - name: Install free video tools
        run: python -m pip install -r tools/requirements-free-toolchain.txt
      - name: Verify FFmpeg, PySceneDetect, Pillow and Auto-Editor installed
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          auto-editor --help > /dev/null
          python -c "import PIL, scenedetect; print('FREE_TOOLS_INSTALLED', PIL.__version__, scenedetect.__version__)"
      - name: Test source license gate (no uploads)
        run: python -m unittest discover -s tests -p test_free_toolchain.py -v
      - name: Inspect 6 archived videos and generate contact sheets
        run: python tools/creator_toolchain_audit.py --input-dir media-mixed --output-dir reports/free-creator-tools
      - name: Upload read-only QA report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-free-toolchain-qa
          path: reports/free-creator-tools/
          if-no-files-found: warn
          retention-days: 21
      - name: Optional Auto-Editor cut of a rights-approved source only
        if: github.event_name == 'workflow_dispatch' && inputs.source_file != ''
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: python tools/trim_owned_video.py --source "$SOURCE_FILE"
      - name: Upload optional editing result, never auto-published
        if: github.event_name == 'workflow_dispatch' && inputs.source_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-auto-edited-clips-needs-review
          path: work-products/
          if-no-files-found: warn
          retention-days: 7
