name: Complete three real Windows demo voice previews (never publish)
on:
  push:
    branches: ['win11-batch-5-review-20261122']
    paths: ['.github/workflows/complete-win11-three-voice-previews.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: win11-batch01-voice-completed-review
  cancel-in-progress: false
jobs:
  render:
    if: ${{ github.repository == 'haidtbasaomh-blip/tiktok-cong-nghe-media' && github.ref == 'refs/heads/win11-batch-5-review-20261122' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing local free voice and rendering dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install 'vieneu==3.7.1'
      - name: Render three exact captured videos with narration and low music
        run: |
          python -m py_compile tools/render_batch01_missing_voice.py
          python tools/render_batch01_missing_voice.py
      - name: Verify outputs and archive review files only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("review/batch-01/voice-completed-20261126")
          j=json.loads((p/"proof.json").read_text())
          assert j["completedAudioExports"]==3 and j["published"]==0 and j["scheduled"]==0
          assert all(x["videoPacketsUnchanged"] and not x["approvedForPublication"] and not x["approvedForBuffer"] for x in j["videos"])
          assert len(list(p.glob("*.mp4")))==3
          PY
          git config user.name "windows-voice-review[bot]"
          git config user.email "windows-voice-review[bot]@users.noreply.github.com"
          git add review/batch-01/voice-completed-20261126
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media(tiktok): archive three 58s Anh Khoi real Windows narration previews, no publish"
          git push origin HEAD:refs/heads/win11-batch-5-review-20261122
      - name: Retain actual downloadable previews and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win11-three-narrated-review-previews
          path: review/batch-01/voice-completed-20261126/
          retention-days: 30
          if-no-files-found: warn
